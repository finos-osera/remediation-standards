# Pull-request previews only. Production is deployed by GitHub Pages.
[build]
  base = "."
  ignore = 'test "$CONTEXT" != "deploy-preview"'
  command = 'test "$CONTEXT" = "deploy-preview" && npm --prefix website ci && npm --prefix website test && npm --prefix website run build'
  publish = "website/build"

[build.environment]
  NODE_VERSION = "22"
