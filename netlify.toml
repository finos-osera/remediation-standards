[build]
  base = "docs"
  command = "python3 ../tools/build_site.py"
  publish = "_site"

[build.environment]
  JEKYLL_ENV = "production"
  RUBY_VERSION = "3.3"

[context.deploy-preview]
  ignore = "false"

# Keep snapshot URLs and bytes intact; no HTML/CSS/JS rewriting or pretty URLs.
[build.processing]
  skip_processing = true

[build.processing.html]
  pretty_urls = false
