name: 🚀 Feature Request
description: I have a suggestion (and may want to implement it 🙂)!
body:
  - type: markdown
    attributes:
      value: |
        Please describe the problem first, then any solutions you have in mind.
  - type: textarea
    id: problem
    attributes:
      label: Description of Problem
      description: What problem are you trying to solve that the project doesn't currently solve? Please resist the temptation to describe your request in terms of a solution. Job Story form ("When [triggering condition], I want to [motivation/goal], so I can [outcome].") can help ensure you're expressing a problem statement.
    validations:
      required: true
  - type: textarea
    id: solutions
    attributes:
      label: Potential Solutions
      description: Clearly and concisely describe what you want to happen. Add any considered drawbacks. If you've considered alternatives, clearly and concisely describe those too.
    validations:
      required: false
