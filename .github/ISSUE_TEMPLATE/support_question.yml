name: 🤗 Support Question
description: If you have a question about configuration, usage, etc. 💬
body:
  - type: markdown
    attributes:
      value: |
        Please search existing issues first — someone might have already asked something similar.
  - type: checkboxes
    id: searched
    attributes:
      label: Existing issues
      options:
        - label: I have searched existing issues and did not find a similar question
          required: true
  - type: textarea
    id: question
    attributes:
      label: Support Question
      description: Ask your question here.
    validations:
      required: true
