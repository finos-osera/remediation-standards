name: Docusaurus exploration
on:
  pull_request:
    paths:
      - "website/**"
      - "docs/_standards/**"
      - ".github/workflows/docusaurus.yml"
      - "netlify.toml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: website/package-lock.json
      - run: npm ci
        working-directory: website
      - run: npm test
        working-directory: website
      - run: npm run build
        working-directory: website
      - uses: actions/upload-artifact@v4
        with:
          name: docusaurus-prototype
          path: website/build
