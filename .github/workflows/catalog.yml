name: Catalog validation

on:
  workflow_call:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ruby/setup-ruby@824c0e29fdfc7d689c191c27acc969d2d04b7dd8 # v1.331.0
        with:
          ruby-version: "3.2"
      - name: Test profile relationships
        run: ruby tools/test/profile_relationships_test.rb
      - name: Validate standards-as-code catalog
        run: ruby tools/generate_catalog.rb --check
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema>=4,<5'
      - name: Test report-binding evidence schema
        run: python -m unittest discover -s tools/test -p '*_schema_test.py'
