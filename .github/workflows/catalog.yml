name: Catalog validation

on:
  pull_request:
  push:
    branches:
      - main
      - "codex/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Test profile relationships
        run: ruby tools/test/profile_relationships_test.rb
      - name: Validate standards-as-code catalog
        run: ruby tools/generate_catalog.rb --check
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install JSON Schema validator
        run: python -m pip install 'jsonschema>=4,<5'
      - name: Test report-binding evidence schema
        run: python -m unittest discover -s tools/test -p '*_schema_test.py'
