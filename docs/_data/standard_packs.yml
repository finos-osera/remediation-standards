- schema-version: 0.1.0
  id: OSERA-SP-0.1.0
  title: OSERA Remediation Standards Pack 0.1.0
  status: Ratified initial standards pack
  proposed_date: 2026-08-27
  target_decision_date: 2026-09-03
  target_gate_date: 2026-09-20
  ratified_date: 2026-09-04
  issue: https://github.com/finos-osera/remediation-standards/issues/12
  agenda_issue: https://github.com/finos-osera/remediation-standards/issues/24
  standards_as_code_issue: https://github.com/finos-osera/remediation-standards/issues/23
  branch: codex/issue-23-standards-as-code-sp010
  summary: First ratified OSERA remediation standards pack, approved on September 4, 2026 for the September 20 gate. REL-003 remains pending compatibility test results, with a decision expected in the next 24 to 48 hours, and is not part of this ratified initial set.
  release_metadata:
    scope: REL-003 release metadata guidance remains pending compatibility test results, with a decision expected in the next 24 to 48 hours, and is not ratified in this initial OSERA-SP-0.1.0 set.
    default_intent: Preserve SemVer 2.0 semantics where practical while allowing package-specific adaptations that improve effective consumption by stakeholders.
    official_token: osera-patch.NNN
    official_example: 5.3.39+osera-patch.001
    legacy_token: backpatch.NNN
    legacy_posture: Existing +backpatch.NNN releases remain legacy/proof-of-concept evidence while REL-003 is pending.
  approved_producers:
    registry: docs/_data/approved_producers.yml
    lifecycle_policy: Producer registry updates that do not change standard text or check semantics may be handled as patch-level standards-pack updates.
  evidence_summary:
    - 60 public finos-osera/backpatch-* repositories observed on 2026-08-25.
    - 59 legacy/proof-of-concept baseline tags observed in the form `v<VERSION>+backpatch.baseline` across 59 repositories.
    - 61 legacy/proof-of-concept release tags observed in the form `v<VERSION>+backpatch.NNN` across 55 repositories.
    - Issue 13 discussion favored visible OSERA branding in release metadata for SCA, inventory, and audit workflows.
    - Issue 23 established Markdown plus structured YAML front matter, schema validation, and generated catalog artifacts as the standards-as-code model.
    - On September 4, 2026, the working group ratified the initial OSERA-SP-0.1.0 standards set, excluding REL-003 pending Java package resolver and update-tool compatibility evidence expected in the next 24 to 48 hours.
  included_standards:
    - id: STD-001
      version: 0.1.0
      role: Required check
      rationale: The standards group needs a machine-readable source format before ratifying a pack that acceptance gates can consume.
      checks:
        - STD-001.CHECK-001
        - STD-001.CHECK-002
    - id: FORK-001
      version: 0.1.0
      role: Required check
      rationale: Repository naming and canonical finos-osera location remain the simplest v0.1.0 provenance model; new standardized repositories use patch-*.
      checks:
        - FORK-001.CHECK-001
        - FORK-001.CHECK-002
    - id: FORK-002
      version: 0.1.0
      role: Required check
      rationale: Version-scoped patch branches are simple to create and necessary for multiple supported lines.
      checks:
        - FORK-002.CHECK-001
    - id: FORK-003
      version: 0.1.0
      role: Required check
      rationale: Baseline tags are essential for source comparison and audit evidence; new standardized baseline tags use +patch.baseline.
      checks:
        - FORK-003.CHECK-001
    - id: SRC-002
      version: 0.1.0
      role: Required evidence
      rationale: Provenance links are central to reviewability and auditability.
      checks:
        - SRC-002.CHECK-001
    - id: SRC-003
      version: 0.1.0
      role: Required check
      rationale: License-header consistency can be enforced where the local convention is determinable, with a not-applicable result when no convention exists.
      checks:
        - SRC-003.CHECK-001
    - id: REL-001
      version: 0.1.0
      role: Required evidence
      rationale: Test provenance stays in scope for v0.1.0 as a published unit-test report artifact, while build provenance and signed source-to-binary proof move to REL-007 observe mode.
      checks:
        - REL-001.CHECK-001
    - id: REL-002
      version: 0.1.0
      role: Required check
      rationale: Runtime compatibility is a high-impact recipient concern and can be measured at publication time.
      checks:
        - REL-002.CHECK-001
    - id: REL-004
      version: 0.1.0
      role: Required check
      rationale: The gate needs an approved-producer allow list so official artifacts come from a known participant.
      checks:
        - REL-004.CHECK-001
        - REL-004.CHECK-002
    - id: REL-005
      version: 0.1.0
      role: Required check
      rationale: Package metadata and checksum hygiene are practical for the September 20 gate and necessary for reliable consumption.
      checks:
        - REL-005.CHECK-001
        - REL-005.CHECK-002
    - id: FEED-001
      version: 0.1.0
      role: Required evidence
      rationale: Feeds are necessary for enterprise consumption, and the gate can verify exact purl coverage for official artifacts.
      checks:
        - FEED-001.CHECK-001
        - FEED-001.CHECK-002
  pending_standards:
    - id: REL-003
      version: 0.1.0
      role: Pending ratification
      rationale: Version and coordinate naming remains pending until Java package resolver and dependency update-tool compatibility test results are reviewed, with a decision expected in the next 24 to 48 hours.
      checks:
        - REL-003.CHECK-001
        - REL-003.CHECK-002
  advisory_standards: []
  observe_standards:
    - id: FORK-004
      version: 0.0.1
      role: Observe-only check
      rationale: Public source, same-license release, and official-fork hosting are important to recipient trust, but exact evidence rules need v0.2.0 work.
      checks:
        - FORK-004.CHECK-001
        - FORK-004.CHECK-002
        - FORK-004.CHECK-003
    - id: SRC-001
      version: 0.0.1
      role: Observe-only check
      rationale: Consumers need patch-basis classification, but the working group needs a controlled vocabulary and minimum wording before it can be enforced.
      checks:
        - SRC-001.CHECK-001
    - id: REL-006
      version: 0.0.1
      role: Observe-only check
      rationale: Patch request or backlog authorization is useful, but public/private sponsorship policy is not ready to enforce.
      checks:
        - REL-006.CHECK-001
    - id: REL-007
      version: 0.0.1
      role: Observe-only check
      rationale: Build provenance and signed attestation should be the first v0.2.0 track while the v0.1.0 gate focuses on source provenance, test provenance, and publication hygiene.
      checks:
        - REL-007.CHECK-001
        - REL-007.CHECK-002
    - id: REL-008
      version: 0.0.1
      role: Observe-only check
      rationale: Build-security scanning is important, but the working group needs evidence about practical scanner coverage across ecosystems before making it enforceable.
      checks:
        - REL-008.CHECK-001
        - REL-008.CHECK-002
    - id: EVD-001
      version: 0.0.1
      role: Observe-only check
      rationale: Recipient guidance is valuable for routing testing, but the expected format needs v0.2.0 refinement before it can become advisory or required.
      checks:
        - EVD-001.CHECK-001
    - id: APP-001
      version: 0.0.1
      role: Observe-only check
      rationale: Estate-wide automated application depends on downstream tooling and recipient operating models that are not proven enough for the first gate.
      checks:
        - APP-001.CHECK-001
  deferred_standards:
    - id: FORK-004
      version: 0.0.1
      role: Observe-only check
      rationale: Tracked in observe mode for OSERA-SP-0.1.0 and expected to be reconsidered for OSERA-SP-0.2.0.
    - id: SRC-001
      version: 0.0.1
      role: Observe-only check
      rationale: Tracked in observe mode until patch-basis vocabulary and provider wording are defined.
    - id: REL-006
      version: 0.0.1
      role: Observe-only check
      rationale: Tracked in observe mode until the backlog and private sponsorship model is settled.
    - id: REL-007
      version: 0.0.1
      role: Observe-only check
      rationale: Tracked in observe mode until producer signed build provenance is specified and implemented.
    - id: REL-008
      version: 0.0.1
      role: Observe-only check
      rationale: Tracked in observe mode until package ecosystem scanning expectations and evidence formats are defined.
    - id: EVD-001
      version: 0.0.1
      role: Observe-only check
      rationale: Tracked in observe mode until the recipient guidance format is better defined.
    - id: APP-001
      version: 0.0.1
      role: Observe-only check
      rationale: Tracked in observe mode until estate-wide application workflows are proven.
  discussion_topics:
    - Confirm whether any post-ratification standards-as-code schema refinements are needed before the September 20 gate.
    - Resolve REL-003 after reviewing whether official OSERA Java package artifacts should use SemVer build metadata, Maven-style qualifiers, or ecosystem-specific profiles for `+osera-patch.NNN`-style release identifiers.
    - Whether new standardized repositories and source branches should use `patch-*` and `patch/`, while historical `backpatch-*` repositories remain legacy/proof-of-concept evidence.
    - How the approved-producer registry is approved, updated, signed, and bound to pack patch versions.
    - Which build-security scanning expectations are realistic across legacy package ecosystems and should be considered for OSERA-SP-0.2.0 after the member tooling survey.
    - Which v0.2.0 observe-mode checks should be promoted after the first gate.
    - Whether generated catalog artifacts should also be published as signed GitHub releases or OCI artifacts after ratification.
